<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B75FF" />
      <stop offset="100%" stop-color="#6D4AFF" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D4AFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8B75FF" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="#0D0D0F" />
  <!-- Glowing Celestial Arc Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="130 35" stroke-linecap="round" />
  <!-- Inner Brand Monogram RB -->
  <text x="32" y="38.5" text-anchor="middle" font-family="'JetBrains Mono', -apple-system, monospace" font-size="22" font-weight="800" fill="url(#rbGrad)" letter-spacing="-1">RB</text>
  <!-- Subtle Astronomical Sparkle -->
  <circle cx="48" cy="16" r="2" fill="#4ADE80" />
</svg>
